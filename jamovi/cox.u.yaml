title: Cox Regression
name: cox
jus: '2.0'
stage: 0
compilerMode: tame
events:
  update: './cox.events::update'
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Time
        children:
          - type: VariablesListBox
            name: elapsed
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Event
        children:
          - type: VariablesListBox
            name: event
            maxItemCount: 1
            isTarget: true
            fitToGrid: true
          - type: LevelSelector
            name: eventLevel
            enable: (event)
      - type: TargetLayoutBox
        label: Factors
        children:
          - type: VariablesListBox
            name: factors
            isTarget: true
            events:
              change: './cox.events::onChange_predictors'
      - type: TargetLayoutBox
        label: Covariates
        children:
          - type: VariablesListBox
            name: covs
            isTarget: true
            events:
              change: './cox.events::onChange_predictors'
      - type: TargetLayoutBox
        label: Strata
        children:
          - type: VariablesListBox
            name: strata
            isTarget: true
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: LayoutBox
        cell:
          column: 0
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Hazard ratios
            children:
              - type: CheckBox
                name: uniMulti
              - type: CheckBox
                name: coefDetails
      - type: LayoutBox
        cell:
          column: 1
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Model
            children:
              - type: CheckBox
                name: globalTests
              - type: CheckBox
                name: ph
              - type: CheckBox
                name: cBoot
                children:
                  - type: TextBox
                    name: bootN
                    format: number
                    enable: (cBoot)
  - type: CollapseBox
    label: Interactions
    collapsed: true
    stretchFactor: 1
    children:
      - type: Supplier
        name: interactionSupplier
        label: Model variables
        persistentItems: true
        stretchFactor: 1
        events:
          update: './cox.events::onUpdate_interactionSupplier'
        children:
          - type: TargetLayoutBox
            transferAction: interactions
            label: Interaction terms
            children:
              - type: ListBox
                name: interactions
                valueFilter: unique
                isTarget: true
                itemDropBehaviour: emptyspace
                template:
                  type: TermLabel
  - type: CollapseBox
    label: Plots
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: forest
              - type: CheckBox
                name: phPlot
              - type: ComboBox
                name: palette
              - type: ComboBox
                name: timeUnit
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: VariableSupplier
                persistentItems: false
                stretchFactor: 1
                children:
                  - type: TargetLayoutBox
                    label: Adjusted curves by
                    children:
                      - type: VariablesListBox
                        name: adjVar
                        maxItemCount: 1
                        isTarget: true
              - type: CheckBox
                name: adjKM
                enable: (adjVar)
  - type: CollapseBox
    label: Options
    collapsed: true
    stretchFactor: 1
    children:
      - type: CheckBox
        name: showExplanations
